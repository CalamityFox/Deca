---
name: Container Workflow
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 11 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '**/misc/*'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build deca:latest and push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eoux pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git fetch --depth=1 \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"
          git checkout FETCH_HEAD

      - name: Clear space
        run: |
          set -eoux pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift
          sudo podman system prune --all --force || true
          df -h /

      - name: Configure Deca
        run: |
          echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

          cat <<'EOF' >> decaconf
          FROM quay.io/fedora/fedora-bootc:latest
          RUN <<-'EOT' sh

          RPM=(
           age
           borgbackup
           @cinnamon-desktop-environment
           lightdm
           lightdm-gtk-greeter
           niri
           noctalia
           xdg-desktop-portal-gtk
           yt-dlp
           )
           
          EXCLUDE=(
           alacritty
           eom
           file-roller
           firefox
           fuzzel
           gnome-software
           gnome-terminal
           mpv
           pidgin
           ptyxis
           rygel
           simple-scan
           swaylock
           thunderbird
           transmission-gtk
           velocitty
           waybar
           xawtv
           xed
           xfburn
           xreader
           yelp
           zoitechat
           )

          EXCLUDED=()
          for pkg in "${EXCLUDE[@]}"; do
           EXCLUDED+=("--exclude=$pkg")
          done

          dnf5 install -y --skip-unavailable --setopt=install_weak_deps=False "${EXCLUDE_ARGS[@]}" "${RPM[@]}"
          rpm -qa
          
          mkdir -p /usr/share/deca

          bootc container lint
          EOT
          COPY files/* /usr/share/deca/
          EOF

      - name: Build w. Buildah
        run: |
          set -eoux pipefail
          buildah bud \
          --pull=newer \
          --tag "deca:latest" \
          --tag "deca:$DATE" \
          --tag "deca:latest-$DATE" \
          --file decaconf .

      - name: Rechunk w. Chunkah
        run: |
          set -eoux pipefail

          WORKDIR="$(mktemp -d ./deca_chunkah_XXXXXX)"
          WORKDIR="$(realpath "$WORKDIR")"
          mkdir -p "$WORKDIR/out"
          trap 'rm -rf "$WORKDIR"' EXIT

          podman inspect deca:latest > "$WORKDIR/chunkah-config.json"

          podman run --rm \
            --mount=type=image,src=deca:latest,target=/chunkah \
            -v "$WORKDIR/chunkah-config.json:/chunkah-config.json:ro,Z" \
            -v "$WORKDIR/out:/run/out:Z" \
            quay.io/coreos/chunkah:latest \
            build \
            --verbose \
            --compressed \
            --max-layers 512 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          CHUNKID="$(podman pull "oci:$WORKDIR/out/chunked")"

          podman tag "$CHUNKID" \
            "deca:latest" \
            "deca:$DATE" \
            "deca:latest-$DATE"

      - name: Push To GHCR
        id: push-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eoux pipefail

          printenv TOKEN | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

          HASH=""
          for TAG in "$DATE" latest "latest-$DATE"; do
            podman push --digestfile=/tmp/digestfile \
              "deca:$TAG" "ghcr.io/calamityfox/deca:$TAG"
            HASH=$(< /tmp/digestfile)
          done

          echo "HASH=$HASH" >> "$GITHUB_OUTPUT"

      - name: Sign w. Cosign
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN: ${{ secrets.COSIGN }}
          VERSION: v3.1.4
          HASH: ${{ steps.push-image.outputs.HASH }}
        run: |
          set -eoux pipefail
          cd "$(mktemp -d)"
          curl -fsSL --retry 3 -o cosign \
            "https://github.com/sigstore/cosign/releases/download/${VERSION}/cosign-linux-amd64"
          sudo install -m 0755 cosign /usr/local/bin/cosign

          mkdir -p "$HOME/.docker"
          cp "${XDG_RUNTIME_DIR}/containers/auth.json" "$HOME/.docker/config.json"

          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN \
            "ghcr.io/calamityfox/deca@${HASH}"

        # https://github.com/containers/container-libs/issues/388
        # https://github.com/coreos/rpm-ostree/issues/5509
