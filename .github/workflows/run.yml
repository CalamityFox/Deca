---
name: Container Workflow
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 11 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '**/misc/*'
  workflow_dispatch:

  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and Push Meryyn Container to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eou pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git fetch --depth=1 \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"
          git checkout FETCH_HEAD

      - name: Maximize build space
        run: |
          set -eoux pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Prepare Container
        run: |
          echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          
          cat <<'EOF' >> meryyn-config
          FROM quay.io/fedora/fedora-silverblue:latest
          RUN <<-'EOT' sh
          
          INSTALL=(
           @cinnamon-desktop-environment
           )
          for RPM in "$INSTALL"; do
            dnf5 install -y --setopt=install_weak_deps=False "$RPM"
          done

          REMOVE=(
           eom
           mpv
           pidgin
           simple-scan
           shotwell
           thunderbird
           transmission-gtk
           xawtv
           xed
           xfburn
           xreader
           zoitechat
           )
          for RPM in "$REMOVE"; do
            dnf5 remove -y "$RPM"
          done

          bootc container lint
          EOT
          EOF

      - name: Build Container
        run: |
          set -eoux pipefail
          buildah bud \
          --pull=newer \
          --tag "meryyn:latest" \
          --tag "meryyn:$DATE" \
          --tag "meryyn:latest-$DATE" \
          --file meryyn-config .

      - name: Rechunk Image w. Chunkah
        run: |
          set -eoux pipefail

          WORKDIR="$(mktemp -d ./meryyn_chunkah_XXXXXX)"
          trap 'rm -rf "$WORKDIR"' EXIT

          podman inspect meryyn:latest > "$WORKDIR/chunkah-config.json"

          podman run --rm \
            --mount=type=image,src=meryyn:latest,target=/chunkah \
            -v "$WORKDIR/chunkah-config.json:/chunkah-config.json:ro,Z" \
            -v "$WORKDIR/out:/run/out:Z" \
            quay.io/coreos/chunkah:latest \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          podman tag "$(podman pull "oci:$WORKDIR/out/chunked")" meryyn:latest

      - name: Push To GHCR
        id: push-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
         set -eoux pipefail

         printenv githubToken | podman login ghcr.io \
          -u "${{ github.actor }}" --password-stdin

         HASH=""
         for TAG in "$DATE" latest "latest-$DATE"; do
          podman push --digestfile=/tmp/digestfile \
            "meryyn:$TAG" "ghcr.io/calamityfox/meryyn:$TAG"
          HASH=$(< /tmp/digestfile)
         done

         echo "HASH=$HASH" >> "$GITHUB_OUTPUT"


      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN: ${{ secrets.COSIGN }}
          HASH: ${{ steps.push-image.outputs.HASH }}
        run: |
          set -eoux pipefail
          sudo install -m 0755 cosign /usr/local/bin/cosign

          cosign sign -y --new-bundle-format=false --use-signing-config=false \
          --key env://COSIGN \
          "ghcr.io/calamityfox/meryyn@${HASH}"

         # https://github.com/containers/container-libs/issues/388
         # https://github.com/coreos/rpm-ostree/issues/5509
         # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
